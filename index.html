    {mode==='2d'&&sObj&&sel.t!=='wire'&&<div className="pn absolute top-2 right-2 w-56 rounded-xl p-3 space-y-2 max-h-[70%] overflow-auto">
     <div className="flex justify-between items-center"><b className="text-sm">{sel.t==='item'?sObj.n:sel.t==='op'?(sObj.type==='door'?'Door':'Window'):sel.t==='wall'?'Wall':'Floor zone'}</b><div className="flex gap-1">{sel.t==='item'&&<button className="bt" title="Rotate 90 degrees (R)" onClick={()=>edit('item',sObj.id,{rot:(sObj.rot+90)%360})}><I n="rot"/></button>}<button className="bt" title="Delete (Del)" onClick={del}><I n="trash"/></button></div></div>
     {sel.t==='wall'&&<><F l={`Length (${unit})`} v={unit==='m'?len(sObj):len(sObj)*3.28084} on={v=>{const L=len(sObj),m=unit==='m'?v:v/3.28084;edit('wall',sObj.id,{x2:sObj.x1+(sObj.x2-sObj.x1)/L*m,y2:sObj.y1+(sObj.y2-sObj.y1)/L*m})}}/><F l="Height (m)" v={sObj.h} on={h=>edit('wall',sObj.id,{h})}/><F l="Thickness (m)" v={sObj.t} st={.05} on={t=>edit('wall',sObj.id,{t})}/></>}
     {sel.t==='op'&&<><F l="Width (m)" v={sObj.w} on={w=>edit('op',sObj.id,{w})}/><label className="flex justify-between text-xs"><span className="mu">Type</span><select className="inp w-24" value={sObj.type} onChange={e=>edit('op',sObj.id,{type:e.target.value,w:e.target.value==='door'?WS:1.2})}><option>door</option><option>window</option></select></label></>}
     {sel.t==='item'&&<><F l="Width (m)" v={sObj.w} on={w=>edit('item',sObj.id,{w})}/><F l="Depth (m)" v={sObj.d} on={d=>edit('item',sObj.id,{d})}/><F l="Height (m)" v={sObj.h} on={h=>edit('item',sObj.id,{h})}/><F l="Elevation (m)" v={sObj.elev} on={elev=>edit('item',sObj.id,{elev})}/><F l="Rotation (deg)" v={sObj.rot} st={15} on={rot=>edit('item',sObj.id,{rot:rot%360})}/></>}
     {sel.t==='floor'&&<><F l="Width (m)" v={sObj.w} on={w=>edit('floor',sObj.id,{w})}/><F l="Depth (m)" v={sObj.d} on={d=>edit('floor',sObj.id,{d})}/></>}
     {sel.t!=='op'&&<label className="flex justify-between items-center text-xs"><span className="mu">Color</span><input type="color" value={sObj.col} onChange={e=>edit(sel.t,sObj.id,{col:e.target.value,pat:''})}/></label>}
    </div>}
    <div className="absolute bottom-2 left-2 right-2 text-xs mu truncate pointer-events-none">{msg||(mode==='2d'?HINT[tool]:fp?'Drag to look. W A S D or arrow keys to walk.':'Drag to orbit, right-drag to pan, wheel to zoom.')}</div>
   </main>
  </div>
  {modal==='bom'&&<Modal t="Bill of materials" x={()=>setModal(null)}><table className="w-full text-sm"><tbody>
   {[['Wall area, gross',bom.gross.toFixed(2)+' m²'],['Wall area, net of openings',bom.net.toFixed(2)+' m²'],['Floor area',bom.fl.toFixed(2)+' m²'],['Doors / windows',`${bom.doors} / ${P.ops.length-bom.doors}`],['Wall segments',P.walls.length],['Wire runs (est. length)',`${P.wires.length} (${bom.wl.toFixed(1)} m)`],['Estimated component count',bom.comps]].map(([a,b])=><tr key={a} style={{borderBottom:'1px solid var(--bd)'}}><td className="py-1 mu">{a}</td><td className="py-1 text-right">{b}</td></tr>)}
   {Object.entries(bom.cnt).map(([a,b])=><tr key={a} style={{borderBottom:'1px solid var(--bd)'}}><td className="py-1">{a}</td><td className="py-1 text-right">× {b}</td></tr>)}</tbody></table></Modal>}
  {modal==='data'&&<Modal t="Save or load project" x={()=>setModal(null)}><textarea className="inp w-full h-48 font-mono" value={txt} onChange={e=>setTxt(e.target.value)}/><div className="flex gap-2 mt-2 flex-wrap">
   <button className="bt on" onClick={()=>load(txt)}>Load from text</button><button className="bt" style={{border:'1px solid var(--bd)'}} onClick={()=>navigator.clipboard?.writeText(txt)}>Copy</button>
   <a className="bt" style={{border:'1px solid var(--bd)'}} download="plancraft-project.json" href={'data:application/json;charset=utf-8,'+encodeURIComponent(txt)}>Download file</a>
   <label className="bt cursor-pointer" style={{border:'1px solid var(--bd)'}}>Open file<input type="file" accept=".json" hidden onChange={e=>{const fl=e.target.files[0];fl&&fl.text().then(load)}}/></label></div></Modal>}
  {modal==='png'&&<Modal t="Blueprint export" x={()=>setModal(null)}><img src={txt} alt="Blueprint" className="w-full rounded-md" style={{border:'1px solid var(--bd)'}}/><a className="bt on mt-2" download="plancraft-blueprint.png" href={txt}>Download PNG</a></Modal>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
