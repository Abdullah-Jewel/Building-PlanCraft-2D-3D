   {parseFloat(np.w)>0&&parseFloat(np.l)>0&&<div className="text-xs" style={{color:'var(--ac)'}}>Area: {(np.w*np.l*(np.u==='ft'?.092903:1)).toFixed(1)} m² ({(np.w*np.l*(np.u==='ft'?1:10.7639)).toFixed(0)} sq ft)</div>}
   {msg&&<div className="text-xs" style={{color:'#dc2626'}}>{msg}</div>}
   <button className="bt on w-full justify-center py-3 text-base" onClick={createPlan}>Create my plan</button>
   <button className="bt w-full justify-center" style={{border:'1px solid var(--bd)'}} onClick={()=>setModal(null)}>Explore the sample house</button></div></Modal>}
  {modal==='cost'&&<CostModal P={PA} roof={roofS} close={()=>setModal(null)}/>}
  {modal==='roof'&&<Modal t="Roof design" x={()=>setModal(null)}><div className="space-y-3 text-sm">
   <div className="flex gap-1 flex-wrap">{[['flat','Flat roof'],['hip','Hip roof'],['gable','Gable roof']].map(([k,l])=><button key={k} className={`bt ${roofS.roofType===k?'on':''}`} style={{border:'1px solid var(--bd)'}} onClick={()=>setRoof({roofType:k})}>{l}</button>)}</div>
   <p className="mu text-xs">The roof sits on top of {lvName(topLv).toLowerCase()}. A flat RCC roof with a parapet is the usual choice in Bangladesh. Hip and gable roofs are pitched tile roofs over a flat slab.</p>
   {roofS.roofType==='flat'&&<>
    <label className="flex items-center justify-between gap-2">Parapet wall height (m)<input type="number" step=".1" min="0" max="1.5" inputMode="decimal" className="inp" style={{width:90}} value={roofS.parapet} onChange={e=>setRoof({parapet:e.target.value===''?'':+e.target.value})}/></label>
    <label className="flex items-center gap-2"><input type="checkbox" checked={roofS.mumty!==false} onChange={e=>setRoof({mumty:e.target.checked})}/>Stair cover room (headroom) over the staircase</label>
    {roofS.mumty!==false&&<label className="flex items-center justify-between gap-2">Cover room height (m)<input type="number" step=".1" min="2.1" max="3.5" inputMode="decimal" className="inp" style={{width:90}} value={roofS.mumtyH} onChange={e=>setRoof({mumtyH:e.target.value===''?'':+e.target.value})}/></label>}
    {roofS.mumty!==false&&!PA.items.some(i=>isSt(i)&&lvOf(i)===topLv)&&<p className="text-xs" style={{color:'#b45309'}}>There is no staircase on {lvName(topLv).toLowerCase()}, so no cover room is drawn. Add a staircase there, or use Copy up to carry the stairs from the floor below.</p>}</>}
   <div className="flex gap-2"><button className="bt on" onClick={()=>{setCfg(c=>({...c,roof:true}));setMode('3d');setModal(null)}}>Show roof in 3D</button><button className="bt" style={{border:'1px solid var(--bd)'}} onClick={()=>setModal(null)}>Done</button></div></div></Modal>}
  {modal==='bom'&&<Modal t="Bill of materials" x={()=>setModal(null)}><table className="w-full text-sm"><tbody>
   {[['Wall area, gross',bom.gross.toFixed(2)+' m²'],['Wall area, net of openings',bom.net.toFixed(2)+' m²'],['Floor area',bom.fl.toFixed(2)+' m²'],['Doors / windows',`${bom.doors} / ${PA.ops.length-bom.doors}`],['Wall segments',PA.walls.length],['Wire runs (est. length)',`${PA.wires.length} (${bom.wl.toFixed(1)} m)`],['Estimated component count',bom.comps]].map(([a,b])=><tr key={a} style={{borderBottom:'1px solid var(--bd)'}}><td className="py-1 mu">{a}</td><td className="py-1 text-right">{b}</td></tr>)}
   {Object.entries(bom.cnt).map(([a,b])=><tr key={a} style={{borderBottom:'1px solid var(--bd)'}}><td className="py-1">{a}</td><td className="py-1 text-right">× {b}</td></tr>)}</tbody></table></Modal>}
  {modal==='data'&&<Modal t="Save or load project" x={()=>setModal(null)}><textarea className="inp w-full h-48 font-mono" value={txt} onChange={e=>setTxt(e.target.value)}/><div className="flex gap-2 mt-2 flex-wrap">
   <button className="bt on" onClick={()=>load(txt)}>Load from text</button><button className="bt" style={{border:'1px solid var(--bd)'}} onClick={()=>navigator.clipboard?.writeText(txt)}>Copy</button>
   <a className="bt" style={{border:'1px solid var(--bd)'}} download="plancraft-project.json" href={'data:application/json;charset=utf-8,'+encodeURIComponent(txt)}>Download file</a>
   <label className="bt cursor-pointer" style={{border:'1px solid var(--bd)'}}>Open file<input type="file" accept=".json" hidden onChange={e=>{const fl=e.target.files[0];fl&&fl.text().then(load)}}/></label></div></Modal>}
  {modal==='export'&&<Modal t="Export / Download" x={()=>setModal(null)}><div className="space-y-2 text-sm">{[[['plan'],'2D floor plan'],[['elec'],'Electrical layout'],[['3d'],'3D view'],[['plan','elec','3d'],'All three views']].map(([k,l],n)=><div key={l} className="flex items-center justify-between gap-2 py-1" style={n===3?{borderTop:'1px solid var(--bd)'}:{}}><b className="font-medium">{l}</b><span className="flex gap-1"><button disabled={busy} className="bt on" onClick={()=>doExport('pdf',k)}><I n="dl" s={14}/>PDF</button><button disabled={busy} className="bt" style={{border:'1px solid var(--bd)'}} onClick={()=>doExport('html',k)}><I n="dl" s={14}/>HTML</button></span></div>)}
   {busy&&<div className="mu text-xs">Capturing views, please wait...</div>}{msg&&<div className="text-xs" style={{color:'var(--ac)'}}>{msg}</div>}
   {Object.keys(shots).length>0&&<div className="grid grid-cols-3 gap-1.5">{Object.entries(shots).map(([k,v])=><div key={k} className="text-[10px] mu"><img src={v.url} alt={NAMES[k]} className="w-full rounded" style={{border:'1px solid var(--bd)'}}/>{NAMES[k]}</div>)}</div>}
   <p className="text-xs mu">If your browser blocks a download, long-press a preview and choose Save image.</p></div></Modal>}
  {modal==='png'&&<Modal t="Blueprint export" x={()=>setModal(null)}><img src={txt} alt="Blueprint" className="w-full rounded-md" style={{border:'1px solid var(--bd)'}}/><a className="bt on mt-2" download="plancraft-blueprint.png" href={txt}>Download PNG</a></Modal>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
