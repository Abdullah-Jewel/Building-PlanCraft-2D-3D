   <a className="bt" style={{border:'1px solid var(--bd)'}} download="plancraft-project.json" href={'data:application/json;charset=utf-8,'+encodeURIComponent(txt)}>Download file</a>
   <label className="bt cursor-pointer" style={{border:'1px solid var(--bd)'}}>Open file<input type="file" accept=".json" hidden onChange={e=>{const fl=e.target.files[0];fl&&fl.text().then(load)}}/></label></div></Modal>}
  {modal==='export'&&<Modal t="Export / Download" x={()=>setModal(null)}><div className="space-y-2 text-sm">{[[['plan'],'2D floor plan'],[['elec'],'Electrical layout'],[['3d'],'3D view'],[['plan','elec','3d'],'All three views']].map(([k,l],n)=><div key={l} className="flex items-center justify-between gap-2 py-1" style={n===3?{borderTop:'1px solid var(--bd)'}:{}}><b className="font-medium">{l}</b><span className="flex gap-1"><button disabled={busy} className="bt on" onClick={()=>doExport('pdf',k)}><I n="dl" s={14}/>PDF</button><button disabled={busy} className="bt" style={{border:'1px solid var(--bd)'}} onClick={()=>doExport('html',k)}><I n="dl" s={14}/>HTML</button></span></div>)}
   {busy&&<div className="mu text-xs">Capturing views, please wait...</div>}{msg&&<div className="text-xs" style={{color:'var(--ac)'}}>{msg}</div>}
   {Object.keys(shots).length>0&&<div className="grid grid-cols-3 gap-1.5">{Object.entries(shots).map(([k,v])=><div key={k} className="text-[10px] mu"><img src={v.url} alt={NAMES[k]} className="w-full rounded" style={{border:'1px solid var(--bd)'}}/>{NAMES[k]}</div>)}</div>}
   <p className="text-xs mu">If your browser blocks a download, long-press a preview and choose Save image.</p></div></Modal>}
  {modal==='png'&&<Modal t="Blueprint export" x={()=>setModal(null)}><img src={txt} alt="Blueprint" className="w-full rounded-md" style={{border:'1px solid var(--bd)'}}/><a className="bt on mt-2" download="plancraft-blueprint.png" href={txt}>Download PNG</a></Modal>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
